<title>SafeBuilt Solutions – Fire Door Inspection</title>
<style>
:root{--red:#c62828;--green:#2e7d32;--grey:#8a8f98;--bg:#f2f3f6;--ink:#1d2330;--brand:#141414;--sb-yellow:#dcca1c;--sb-pink:#e53376;--sb-yellow-tint:#fbf8e1;--check:#e0a100}
/* brand colours above are fallbacks: applyBrand() sets them from BRAND.colors */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header.top{position:sticky;top:0;z-index:5;background:var(--brand);border-bottom:3px solid var(--sb-yellow);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand b{display:block;font-size:17px;letter-spacing:.01em}.brand span{font-size:13px;opacity:.9}
.tag{background:#ffeb3b;color:#000;font-size:11px;font-weight:800;padding:4px 8px;border-radius:4px;white-space:nowrap}
main{padding:12px 12px 8px;max-width:820px;margin:0 auto}
nav.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ddd;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.bottom a{flex:1;text-align:center;padding:16px 0;font-weight:700;color:#555;text-decoration:none;min-height:56px}
nav.bottom a.on{color:var(--brand);box-shadow:inset 0 3px 0 var(--sb-pink)}
.card{background:#fff;border-radius:12px;padding:14px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
h2{font-size:18px;margin:0 0 10px}
label.f{display:block;margin:0 0 12px;font-size:13px;color:#555;font-weight:600}
input[type=text],input[type=date],input[type=number],select,textarea{display:block;width:100%;font-size:16px;padding:12px;border:1px solid #c9ccd3;border-radius:8px;margin-top:4px;background:#fff;color:inherit;min-height:48px;font-family:inherit;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#666 50%),linear-gradient(135deg,#666 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea{min-height:84px;resize:vertical}
textarea.sn{min-height:44px;height:44px;overflow:hidden;resize:none;padding:10px;border-left:4px solid var(--sb-yellow)}
.snchk{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0 2px;min-height:36px}.snchk input{width:20px;height:20px;accent-color:var(--brand)}
.dd .sn{border-left:4px solid var(--sb-yellow);background:var(--sb-yellow-tint);padding:6px 10px;margin:8px 0}.dd .sn b{display:block;font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 16px;border-radius:10px;border:1px solid #c9ccd3;background:#fff;font-size:16px;font-weight:600;color:var(--ink);text-decoration:none;cursor:pointer;font-family:inherit;text-align:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.block{display:flex;width:100%}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{min-height:40px;padding:6px 10px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.seg{display:flex;gap:6px;margin-top:8px}
.seg button{flex:1;min-height:50px;border:1px solid #c9ccd3;background:#fff;border-radius:8px;font-size:15px;font-weight:700;color:#444;font-family:inherit;padding:4px}
.seg button.on.pass{background:var(--green);color:#fff;border-color:var(--green)}
.seg button.on.fail{background:var(--red);color:#fff;border-color:var(--red)}
.seg button.on.na{background:#607d8b;color:#fff;border-color:#607d8b}
.seg button.on.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.gsum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid;border-radius:6px;padding:7px 10px;margin:8px 0;font-weight:700}.gsum .st{display:inline-block;font-weight:800;color:#fff;padding:2px 8px;border-radius:999px;background:var(--check);font-size:11px}.gsum .st.pass{background:var(--green)}.gsum .st.fail{background:var(--red)}.gdiag{max-width:520px;margin:0 auto}.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.ggrid .full{grid-column:1/-1}.ghd{font-size:13px;font-weight:800;color:var(--brand);padding:6px 8px;margin:4px 0 8px;border-radius:6px;background:#f1f1f3;border-left:4px solid var(--brand);line-height:1.25}.ghd.l2{border-left-color:var(--sb-pink)}.ghd small{display:block;font-weight:600;color:#666;font-size:11px}.gtype{display:inline-block;font-size:12px;font-weight:700;background:var(--brand);color:#fff;border-radius:999px;padding:2px 10px;margin:0 0 8px}@media(max-width:360px){.ghd{font-size:12px;padding:5px 6px}}
.ck{padding:14px 0;border-top:1px solid #eee}
.repsec{background:var(--sb-yellow-tint);border:1px solid #ece3a0;border-left:5px solid var(--sb-yellow);border-radius:10px;padding:12px 12px 2px;margin:-2px 0 14px}.repsec[hidden]{display:none}.repsec h3{margin:0 0 2px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rpill{display:inline-block;background:var(--sb-pink);color:#fff;font-size:11px;font-weight:800;letter-spacing:.03em;border-radius:999px;padding:2px 9px}.repsec .hint{margin:0 0 10px}.repsec .ghd{background:#fff}.repsec .opt{font-size:13px;font-weight:800;color:#555;margin:2px 0 8px;border-top:1px dashed #d9cf7a;padding-top:10px}
.mmin{position:relative;display:block}.mmin input{padding-right:46px}.mmin i{position:absolute;right:12px;top:50%;transform:translateY(-50%);margin-top:2px;font-style:normal;font-weight:600;color:#888;font-size:14px;pointer-events:none}
.ck b{display:block}
.hint{font-size:13px;color:#666;margin:3px 0 0}
.ck input{margin-top:8px;min-height:44px;padding:10px;font-size:15px}
.badge{display:inline-block;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.03em;color:#fff;background:var(--grey);white-space:nowrap}
.badge.pass{background:var(--green)}.badge.fail{background:var(--red)}
.doors{list-style:none;margin:0 0 12px;padding:0}
.door-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;color:inherit;text-decoration:none;box-shadow:0 1px 2px rgba(0,0,0,.08);border-left:7px solid var(--grey);min-height:76px}
.door-row.pass{border-left-color:var(--green)}.door-row.fail{border-left-color:var(--red)}
.door-row b{font-size:17px}
.door-row small{display:block;color:#666;font-size:13px}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.counts div{background:#fff;border-radius:10px;padding:10px 4px;text-align:center;font-size:12px;color:#555;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.counts b{display:block;font-size:24px;color:var(--ink)}
.counts .p b{color:var(--green)}.counts .x b{color:var(--red)}
.banner{background:#fff8e1;border:1px solid #ffe082}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.mi{border:1px solid #e0e0e0;border-radius:10px;overflow:hidden;background:#fafafa}
.mi img,.mi video{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#222}
.mname{font-size:12px;padding:6px 8px;word-break:break-all;color:#444}
.mbtns{display:flex;gap:6px;padding:0 6px 6px}.mbtns .btn{flex:1;padding:4px 6px}
.uploads{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.uploads label.btn{position:relative;overflow:hidden;font-size:14px;flex-direction:column;gap:2px;min-height:64px;padding:6px}
.uploads label.btn span.i{font-size:22px;line-height:1}
.uploads input{position:absolute;left:0;top:0;opacity:0;width:1px;height:1px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.muted{color:#666;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.actions .wide{grid-column:1/-1}
details>summary{font-weight:700;font-size:17px;min-height:36px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"▾";color:#888}
details[open]>summary{margin-bottom:10px}
.empty{text-align:center;color:#666;padding:24px}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;align-items:center;justify-content:center;z-index:20;font-weight:700}
.busy.show{display:flex}
#fpwrap{-webkit-tap-highlight-color:transparent;position:relative;height:calc(100vh - 290px);min-height:320px;overflow:hidden;background:#e7e8ec;border-radius:12px;touch-action:none;user-select:none;-webkit-user-select:none}
#fpin{position:absolute;left:0;top:0;transform-origin:0 0}
#fpimg{display:block;width:100%;height:100%;pointer-events:none}
.fppin{position:absolute;transform:translate(-50%,-100%) scale(calc(1 / var(--z,1)));transform-origin:50% 100%;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}
.fppin span{display:block;min-width:30px;padding:4px 7px;border-radius:14px 14px 14px 3px;background:var(--grey);color:#fff;font:800 12px/1.2 -apple-system,Arial,sans-serif;white-space:nowrap;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);text-align:center}
.fppin.pass span{background:var(--green)}.fppin.fail span{background:var(--red)}.fppin.mv span{outline:3px solid var(--sb-pink)}
.fpk{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--grey);margin:0 2px 0 6px}.fpk.pass{background:var(--green)}.fpk.fail{background:var(--red)}
#fpsheet{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));background:#fff;border-top:4px solid var(--sb-yellow);border-radius:14px 14px 0 0;padding:14px;z-index:8;box-shadow:0 -4px 16px rgba(0,0,0,.2);max-width:820px;margin:0 auto}
.fpx{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;padding:6px;cursor:pointer}
.fpkv{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}.fpkv th{text-align:left;color:#666;font-weight:600;width:40%;padding:3px 0}.fpkv td{padding:3px 0}
#fpmode button{min-height:40px;padding:4px 10px;font-size:14px}
#qrpanel{scroll-margin-top:calc(80px + env(safe-area-inset-top))}
.qrtip{font-size:13px;color:#5d4037;background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:8px 10px;margin:10px 0 0}
code.did{font-size:13px;background:#f3f3f3;border-radius:4px;padding:2px 5px;word-break:break-all}
footer.copy{max-width:820px;margin:0 auto;padding:4px 16px calc(84px + env(safe-area-inset-bottom));text-align:center;font-size:11px;line-height:1.4;color:#8a8f98}
#lock{position:fixed;inset:0;z-index:1000;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));overflow:auto}
#lock[hidden]{display:none}
#lock form{width:100%;max-width:360px;text-align:center}
#lock img{height:56px;width:auto;max-width:80%;margin:0 auto 14px;display:block}
#lock h1{font-size:19px;margin:0 0 4px}#lock .sub{font-size:14px;opacity:.85;margin:0 0 22px}
#lock input{display:block;width:100%;font-size:16px;padding:12px;min-height:48px;border-radius:10px;border:2px solid var(--sb-yellow);background:#fff;color:#1d2330;margin:0 0 12px;font-family:inherit;-webkit-appearance:none;appearance:none}
#lock .btn{width:100%;background:var(--sb-yellow);border-color:var(--sb-yellow);color:#141414;font-weight:800}
#lock .btn:disabled{opacity:.55}
#lock .msg{min-height:20px;font-size:14px;margin:12px 0 0;color:#ffd0dd}
#lock .copy{font-size:11px;opacity:.6;margin:26px 0 0}
body.locked{overflow:hidden}
@media print{
  header.top,nav.bottom,.noprint,#toast,#lock{display:none!important}
  footer.copy{padding:8px 0 0}
  body{background:#fff}
  main{padding:0;max-width:none}
  .report{padding:0!important;box-shadow:none!important}
  .report .dd{break-inside:avoid}
  .report .schedwrap{overflow:visible!important}
  @page{size:A4;margin:12mm}
}
</style>
</head>

      p.raw(`${col.map(f).join(' ')} rg 1 1 1 RG 1 w ${f(cx+r)} ${f(cy)} m ${f(cx+r)} ${f(cy+c)} ${f(cx+c)} ${f(cy+r)} ${f(cx)} ${f(cy+r)} c ${f(cx-c)} ${f(cy+r)} ${f(cx-r)} ${f(cy+c)} ${f(cx-r)} ${f(cy)} c ${f(cx-r)} ${f(cy-c)} ${f(cx-c)} ${f(cy-r)} ${f(cx)} ${f(cy-r)} c ${f(cx+c)} ${f(cy-r)} ${f(cx+r)} ${f(cy-c)} ${f(cx+r)} ${f(cy)} c B`);
      const s=String(i+1),fs=i+1>99?5.5:7;p.text(cx-tw(s,fs,true)/2,iy+q.y*ih+fs*.36,s,fs,true,[1,1,1])});
    p.y=iy+ih+12;
    pl.pins.forEach((q,i)=>{const d=doorById(q.door);if(!d)return;const st=status(d);p.ensure(13);p.rect(X,p.y+2,8,8,stCol(st));p.text(X+12,p.y+9.5,pt(`${i+1}. ${d.ref||''} – ${d.location||''}`).slice(0,90),8.5,false);pdfPill(p,X+CW-pillW(stLabel(st),6.5),p.y+1.5,stLabel(st),stCol(st),6.5,10);p.y+=12})}}

(async function init(){
  applyBrand();const st=document.createElement('style');st.textContent=REPORT_CSS;document.head.appendChild(st);
  if(!isUnlocked())await showLock();
  try{const raw=localStorage.getItem(LS);if(raw)S=JSON.parse(raw)}catch(e){}
  if(!S||!S.survey){try{await loadSample()}catch(e){S={isSample:false,survey:{date:today()},doors:[]};toast('Storage unavailable: '+e.message)}}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  route();
})();
</script>
