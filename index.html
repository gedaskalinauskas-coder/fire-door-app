<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" href="icons/favicon.ico">
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SafeBuilt Doors">
<title>SafeBuilt Solutions – Fire Door Inspection</title>
<style>
:root{--red:#c62828;--green:#2e7d32;--grey:#8a8f98;--bg:#f2f3f6;--ink:#1d2330;--brand:#141414;--sb-yellow:#dcca1c;--sb-pink:#e53376}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header.top{position:sticky;top:0;z-index:5;background:var(--brand);border-bottom:3px solid #dcca1c;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand b{display:block;font-size:17px;letter-spacing:.01em}.brand span{font-size:13px;opacity:.9}
.tag{background:#ffeb3b;color:#000;font-size:11px;font-weight:800;padding:4px 8px;border-radius:4px;white-space:nowrap}
main{padding:12px 12px calc(96px + env(safe-area-inset-bottom));max-width:820px;margin:0 auto}
nav.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ddd;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.bottom a{flex:1;text-align:center;padding:16px 0;font-weight:700;color:#555;text-decoration:none;min-height:56px}
nav.bottom a.on{color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}
.card{background:#fff;border-radius:12px;padding:14px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
h2{font-size:18px;margin:0 0 10px}
label.f{display:block;margin:0 0 12px;font-size:13px;color:#555;font-weight:600}
input[type=text],input[type=date],select,textarea{display:block;width:100%;font-size:16px;padding:12px;border:1px solid #c9ccd3;border-radius:8px;margin-top:4px;background:#fff;color:inherit;min-height:48px;font-family:inherit;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#666 50%),linear-gradient(135deg,#666 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea{min-height:84px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 16px;border-radius:10px;border:1px solid #c9ccd3;background:#fff;font-size:16px;font-weight:600;color:var(--ink);text-decoration:none;cursor:pointer;font-family:inherit;text-align:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.block{display:flex;width:100%}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{min-height:40px;padding:6px 10px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.seg{display:flex;gap:6px;margin-top:8px}
.seg button{flex:1;min-height:50px;border:1px solid #c9ccd3;background:#fff;border-radius:8px;font-size:15px;font-weight:700;color:#444;font-family:inherit;padding:4px}
.seg button.on.pass{background:var(--green);color:#fff;border-color:var(--green)}
.seg button.on.fail{background:var(--red);color:#fff;border-color:var(--red)}
.seg button.on.na{background:#607d8b;color:#fff;border-color:#607d8b}
.seg button.on.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.ck{padding:14px 0;border-top:1px solid #eee}
.ck b{display:block}
.hint{font-size:13px;color:#666;margin:3px 0 0}
.ck input{margin-top:8px;min-height:44px;padding:10px;font-size:15px}
.badge{display:inline-block;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.03em;color:#fff;background:var(--grey);white-space:nowrap}
.badge.pass{background:var(--green)}.badge.fail{background:var(--red)}
.doors{list-style:none;margin:0 0 12px;padding:0}
.door-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;color:inherit;text-decoration:none;box-shadow:0 1px 2px rgba(0,0,0,.08);border-left:7px solid var(--grey);min-height:76px}
.door-row.pass{border-left-color:var(--green)}.door-row.fail{border-left-color:var(--red)}
.door-row b{font-size:17px}
.door-row small{display:block;color:#666;font-size:13px}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.counts div{background:#fff;border-radius:10px;padding:10px 4px;text-align:center;font-size:12px;color:#555;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.counts b{display:block;font-size:24px;color:var(--ink)}
.counts .p b{color:var(--green)}.counts .x b{color:var(--red)}
.banner{background:#fff8e1;border:1px solid #ffe082}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.mi{border:1px solid #e0e0e0;border-radius:10px;overflow:hidden;background:#fafafa}
.mi img,.mi video{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#222}
.mname{font-size:12px;padding:6px 8px;word-break:break-all;color:#444}
.mbtns{display:flex;gap:6px;padding:0 6px 6px}.mbtns .btn{flex:1;padding:4px 6px}
.uploads{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.uploads label.btn{position:relative;overflow:hidden;font-size:14px;flex-direction:column;gap:2px;min-height:64px;padding:6px}
.uploads label.btn span.i{font-size:22px;line-height:1}
.uploads input{position:absolute;left:0;top:0;opacity:0;width:1px;height:1px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.muted{color:#666;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.actions .wide{grid-column:1/-1}
details>summary{font-weight:700;font-size:17px;min-height:36px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"▾";color:#888}
details[open]>summary{margin-bottom:10px}
.empty{text-align:center;color:#666;padding:24px}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;align-items:center;justify-content:center;z-index:20;font-weight:700}
.busy.show{display:flex}
#qrpanel{scroll-margin-top:calc(80px + env(safe-area-inset-top))}
.qrtip{font-size:13px;color:#5d4037;background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:8px 10px;margin:10px 0 0}
code.did{font-size:13px;background:#f3f3f3;border-radius:4px;padding:2px 5px;word-break:break-all}
@media print{
  header.top,nav.bottom,.noprint,#toast{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .report{padding:0!important;box-shadow:none!important}
  .report .dd{break-inside:avoid}
  .report .schedwrap{overflow:visible!important}
  @page{size:A4;margin:12mm}
}
</style>
</head>

<script>
"use strict";
/* ---------- constants ---------- */
const LS='sbs_firedoor_v1';
const CHECKS=[
 ['leaf','Door leaf condition','No significant damage, holes, splits, delamination or warping; no unauthorised alterations.'],
 ['frame','Frame condition & fixing','Frame secure to structure and undamaged; gap between frame and wall properly fire-stopped/sealed.'],
 ['gaps','Leaf-to-frame gaps','Guidance: typically 2–4 mm (commonly 3 mm ±1) at head, hinge and lock sides and between leaves of double doors. Manufacturer data / BS 8214 take precedence.'],
 ['threshold','Threshold (bottom) gap','Guidance: up to ~10 mm for FD30 doors without smoke control (check certification); ~3 mm where smoke seals are required (FD30S/FD60S) unless a drop seal is fitted.'],
 ['intumescent','Intumescent strips','Present, continuous, correct size, intact – not painted over, damaged or missing sections.'],
 ['smoke','Smoke seals','Present and intact where required (S-rated doors); brush/fin not damaged, missing or painted over.'],
 ['hinges','Hinges','Minimum 3 hinges, secure, no missing, incorrect or damaged screws, CE/UKCA marked, no excessive wear.'],
 ['selfclose','Self-closing device','Fitted and closes the door fully from any angle of opening into the latch (required on flat entrance and communal fire doors).'],
 ['latch','Latching','Door latches positively when closed by the closer; no binding on frame or floor.'],
 ['closer','Door closer condition & adjustment','No oil leaks or damage; closing/latch speed correctly adjusted; arm and fixings secure.'],
 ['signage','Fire safety signage','“Fire door keep shut” (communal doors) or “Fire door keep locked” (risers/cupboards) present and legible.'],
 ['glazing','Glazing & beads (if present)','Fire-rated glass (marked), intact, beads secure, correct intumescent glazing system.'],
 ['ironmongery','Ironmongery','Handles, locks, letter plates, spy holes etc. fire-rated, secure and not compromising the door.'],
 ['holdopen','Hold-open devices (if fitted)','Hold-open/free-swing devices linked to the fire alarm and release on activation; door then closes and latches.'],
 ['cert','Certification label / plug','Third-party certification label or plug present (usually top or hinge edge); note scheme/number if visible.']
];
const TYPES=[['communal','Communal'],['flat','Flat entrance'],['riser','Riser'],['plant','Plant room'],['stair','Stair core']];
const RATINGS=['FD30','FD30S','FD60','FD60S','Unknown'];
const LEAFS=['Single','Double','Leaf and a half'];
const ACTIONS=['Repair','Adjust','Replace'];
const PRIS=['Urgent','Within 3 months','Advisory'];
const GUIDANCE='Gap and seal figures are typical guidance only – BS 8214:2016 and the door manufacturer’s certification data take precedence. Under the Fire Safety (England) Regulations 2022, responsible persons in multi-occupied residential buildings over 11 m must undertake quarterly checks of communal fire doors and use best endeavours to check flat entrance doors annually. This is a visual, non-destructive inspection and does not certify fire performance.';
const REPORT_CSS=`.report{font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#1d2330;background:#fff;padding:16px;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.report .rh{background:#141414;border-bottom:4px solid #dcca1c;color:#fff;padding:14px 16px;border-radius:8px;margin-bottom:12px}.report .rh h1{margin:0;font-size:20px}.report .rh p{margin:2px 0 0;opacity:.95}
.report h2{font-size:16px;margin:18px 0 6px;border-bottom:2px solid #e53376;padding-bottom:3px}
.report .samp{background:#fff8e1;border:1px solid #ffe082;padding:8px 10px;border-radius:6px;margin:8px 0;font-weight:600}
.report table{width:100%;border-collapse:collapse;margin:6px 0}.report th,.report td{border:1px solid #ddd;padding:6px;text-align:left;vertical-align:top}.report th{background:#f3f3f3}
.report .kv th{width:34%}
.report .rc{display:flex;gap:8px;margin:10px 0}.report .rc div{flex:1;border:1px solid #ddd;border-radius:8px;text-align:center;padding:8px;font-size:12px}.report .rc b{display:block;font-size:22px}
.report .rc .p b{color:#2e7d32}.report .rc .x b{color:#c62828}
.report .st{display:inline-block;font-weight:800;color:#fff;padding:2px 8px;border-radius:999px;background:#8a8f98;font-size:11px;white-space:nowrap}.report .st.pass{background:#2e7d32}.report .st.fail{background:#c62828}
.report .schedwrap{overflow-x:auto}.report .sched{font-size:12px;min-width:520px}
.report .dd{border:1px solid #ddd;border-radius:8px;padding:10px;margin:12px 0;page-break-inside:avoid;break-inside:avoid}
.report .dd h3{margin:0 0 4px;font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.report .meta{color:#555;margin:0 0 6px}
.report .cl{font-size:12px}.report .cl td:nth-child(2){white-space:nowrap}
.report .r-pass{color:#2e7d32;font-weight:700}.report .r-fail{color:#c62828;font-weight:700}.report .r-na{color:#607d8b}.report .r-{color:#999}
.report .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.report .thumbs figure{margin:0}.report .thumbs img,.report .thumbs video{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:1px solid #ddd;display:block;background:#222}
.report .thumbs .vid{aspect-ratio:4/3;border-radius:6px;background:#263238;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;padding:6px}
.report .thumbs figcaption{font-size:11px;color:#555;word-break:break-all}
.report .gn{font-size:11px;color:#555;margin-top:16px;border-top:1px solid #ddd;padding-top:8px}
.report a{color:inherit}`;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const safe=s=>String(s||'').trim().replace(/[^A-Za-z0-9._-]+/g,'-').replace(/^-+|-+$/g,'')||'file';
const typeLabel=t=>(TYPES.find(x=>x[0]===t)||['',t||'—'])[1];
const stLabel=s=>s==='pass'?'PASS':s==='fail'?'FAIL':'NOT INSPECTED';
const rLabel=r=>r==='pass'?'Pass':r==='fail'?'Fail':r==='na'?'N/A':'–';
let S=null;
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('Could not save: '+e.message)}}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}
function busy(on,msg){const b=$('#busy');b.textContent=msg||'Preparing file…';b.classList.toggle('show',!!on)}
const doorById=id=>S.doors.find(d=>d.id===id);
function cur(){const h=location.hash.split('/');return h[1]==='door'?doorById(h[2]):null}
const ck=(d,k)=>d.checks[k]||(d.checks[k]={r:'',c:''});
function suggest(d){const v=CHECKS.map(c=>(d.checks[c[0]]||{}).r||'');if(v.includes('fail'))return 'fail';if(v.every(x=>x==='pass'||x==='na'))return 'pass';return ''}

  for(let r=0;r<n;r++){let c=0;while(c<n){if(q.isDark(r,c)){let e=c;while(e<n&&q.isDark(r,e))e++;ops.push(c+' '+r+' '+(e-c)+' 1.02 re');c=e}else c++}}
  p.raw('q 0 0 0 rg '+s.toFixed(5)+' 0 0 '+(-s).toFixed(5)+' '+x.toFixed(3)+' '+(p.H-y).toFixed(3)+' cm\n'+ops.join('\n')+'\nf Q')}
function fitT(s,size,maxW,bold){s=pt(s);if(tw(s,size,bold)<=maxW)return s;while(s.length>1&&tw(s+'\x85',size,bold)>maxW)s=s.slice(0,-1);return s.replace(/\s+$/,'')+'\x85'}
function drawLabel(p,ox,oy,d){const m=v=>v*MM,s=S.survey,Q=doorQR(d),W=[1,1,1];
  /* QR: 30 mm square on the left, vertically centred; >=3 mm from the label edges */
  const qs=m(30),qx=ox+m(3.2),qy=oy+(m(L7163.h)-qs)/2;drawQR(p,Q.q,qx,qy,qs);
  const tx=ox+m(36.2),tr=ox+m(L7163.w-3),TW=tr-tx;let y=oy+m(3);
  p.rect(tx,y,TW,m(6.4),RED);p.text(tx+m(1.8),y+m(4.6),'FIRE DOOR',12.5,true,W);
  const co=pt(CO.name);p.text(tr-m(1.8)-tw(co,6.6,true),y+m(4.3),co,6.6,true,W);y+=m(6.4);
  const rt=pt(d.rating||'Rating: —'),cw=tw(rt,8.5,true)+8;y+=12;
  p.box(tr-cw,y-9.6,cw,11.4,RED);p.text(tr-cw+4,y-1.8,rt,8.5,true,RED);
  p.text(tx,y,fitT(d.ref||'Door',11,TW-cw-6,true),11,true,INK);
  let ll=wrapT(d.location||'Location not recorded',7.5,TW);if(ll.length>2)ll=[ll[0],fitT(ll.slice(1).join(' '),7.5,TW)];
  const g=(2-ll.length)*8.6/4-.2;
  ll.forEach((l,i)=>{y+=i?8.6:9.4;p.text(tx,y,l,7.5,false,INK)});
  y+=8.5+g;p.text(tx,y,fitT('Site: '+(s.site||'—'),7,TW),7,false,SOFT);
  y+=8.5+g;p.text(tx,y,pt('Inspected: '+fmtD(inspDate())),7,false,INK);
  y+=8.6+g;p.text(tx,y,fitT('Next inspection due: '+fmtD(nextDue(d)),7.5,TW,true),7.5,true,RED);
  y+=8.6+g;p.text(tx,y,fitT('Tel '+CO.tel+'  ·  Scan QR for door record',6.6,TW,true),6.6,true,INK);
  p.text(tx,oy+m(L7163.h-2.7),fitT('Door ID: '+Q.id,5.6,TW),5.6,false,SOFT);
}
function buildLabels(doors,start){const p=PDFDoc(),G=L7163;let slot=Math.max(0,Math.min(G.per-1,(start||1)-1));
  ensureIds();
  for(const d of doors){if(slot>=G.per){p.page();slot=0}const c=slot%G.cols,r=Math.floor(slot/G.cols);drawLabel(p,(G.left+c*G.px)*MM,(G.top+r*G.py)*MM,d);slot++}
  return p.build()}

    h+=`<section class="dd"><h3><span>${esc(d.ref)} – ${esc(d.location)}</span><span class="st ${st}">${stLabel(st)}</span></h3><p class="meta">${esc(typeLabel(d.type))} · ${esc(d.rating||'—')} · ${esc(d.leaf||'—')}</p>`;
    h+=`<table class="cl"><thead><tr><th>Check</th><th>Result</th><th>Comment</th></tr></thead><tbody>${CHECKS.map(k=>{const o=d.checks[k[0]]||{};return `<tr><td>${esc(k[1])}</td><td class="r-${o.r||''}">${rLabel(o.r)}</td><td>${esc(o.c||'')}</td></tr>`}).join('')}</tbody></table>`;
    h+=`<table class="kv">${[['Issues found',d.issues],['Recommended action',d.action],['Priority',d.priority],['Notes',d.notes]].map(([k,v])=>`<tr><th>${k}</th><td>${esc(v||'—').replace(/\n/g,'<br>')}</td></tr>`).join('')}</table>`;
    if(d.media.length){h+='<div class="thumbs">';for(const m of d.media){const n=mediaName(d,m);let inner;
      if(mode==='app')inner=m.kind==='video'?`<video data-mid="${m.id}" controls playsinline muted preload="metadata"></video>`:`<img data-mid="${m.id}" alt="${esc(n)}">`;
      else if(m.kind==='video')inner=`<div class="vid">▶ Video<br>${esc(n)}<br>${mode==='zip'?'(click to open)':'(original in ZIP download)'}</div>`;
      else{const t=await thumbFor(m.id,900);inner=t?`<img src="${t.url}" alt="${esc(n)}">`:`<div class="vid">${esc(n)}</div>`}

async function sampleImg(ref,title,kind){
  const c=document.createElement('canvas');c.width=800;c.height=600;const g=c.getContext('2d');
  g.fillStyle='#d8d2c4';g.fillRect(0,0,800,600);g.fillStyle='#8f8f8f';g.fillRect(0,505,800,95);
  g.fillStyle='#f4f4f4';g.fillRect(240,50,320,460);
  const gap=kind==='gap'?22:10;g.fillStyle=kind==='riser'?'#7c8a99':'#b9875c';g.fillRect(256,50+gap+6,288,450-gap-10);
  if(kind==='double'||kind==='gap'||kind==='seal'){g.strokeStyle='#6d4c33';g.lineWidth=3;g.beginPath();g.moveTo(400,62+gap);g.lineTo(400,500);g.stroke()}
  g.fillStyle='#4a4a4a';g.fillRect(kind==='gap'||kind==='seal'?380:505,290,12,54);
  if(kind!=='riser'){g.fillStyle='#1565c0';g.beginPath();g.arc(kind==='gap'||kind==='seal'?330:400,190,46,0,7);g.fill();g.fillStyle='#fff';g.font='bold 13px Arial';g.textAlign='center';const sx=kind==='gap'||kind==='seal'?330:400;g.fillText('FIRE DOOR',sx,186);g.fillText('KEEP SHUT',sx,203)}
  g.fillStyle='#777';g.fillRect(270,64+gap,90,16);
  const ring=(x,y,rx,ry)=>{g.strokeStyle='#e53935';g.lineWidth=7;g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.stroke()};
  if(kind==='gap'){ring(470,64,70,30);g.fillStyle='#e53935';g.font='bold 30px Arial';g.textAlign='left';g.fillText('6 mm',590,74)}
  if(kind==='seal')ring(400,300,26,150);
  if(kind==='closer'){ring(315,72,70,34);g.fillStyle='#e53935';g.font='bold 26px Arial';g.textAlign='left';g.fillText('Not latching',570,300)}
  if(kind==='strip')ring(256,170,24,90);
  if(kind==='riser'){ring(400,190,90,60);g.fillStyle='#e53935';g.font='bold 60px Arial';g.textAlign='center';g.fillText('?',400,212)}
  if(kind==='ok'){g.strokeStyle='#2e7d32';g.lineWidth=16;g.beginPath();g.moveTo(600,120);g.lineTo(640,160);g.lineTo(720,70);g.stroke()}
  g.fillStyle='rgba(0,0,0,.72)';g.fillRect(0,530,800,70);g.fillStyle='#fff';g.textAlign='left';g.font='bold 24px Arial';g.fillText(ref+': '+title,16,560);
  g.font='15px Arial';g.fillStyle='#ffeb3b';g.fillText('SAMPLE PLACEHOLDER IMAGE – not a real photo',16,586);
  g.fillStyle='#ffeb3b';g.fillRect(0,0,120,34);g.fillStyle='#000';g.font='bold 18px Arial';g.fillText('SAMPLE',18,24);
  return new Promise(r=>c.toBlob(r,'image/jpeg',.85));
}

}
function renderMedia(d){const el=$('#media');if(!el)return;
  el.innerHTML=d.media.length?d.media.map(m=>`<div class="mi">${m.kind==='video'?`<video data-mid="${m.id}" controls playsinline muted preload="metadata"></video>`:`<img data-mid="${m.id}" alt="">`}<div class="mname">${esc(mediaName(d,m))}</div><div class="mbtns"><button type="button" class="btn sm" data-act="dlmedia" data-id="${m.id}">⬇ Download</button><button type="button" class="btn sm danger" data-act="delmedia" data-id="${m.id}" aria-label="Delete">🗑</button></div></div>`).join(''):'<p class="muted" style="grid-column:1/-1">No photos or videos yet.</p>';
  hydrate(el)}
async function renderSummary(){setNav('summary');
  app.innerHTML=`<div class="actions noprint">
   <button class="btn primary wide" data-act="pdf">⬇ Download report (PDF)</button>
   <button class="btn" data-act="print">🖨 Print / Save as PDF</button><button class="btn" data-act="html">⬇ Report (HTML)</button>
   <button class="btn dark wide" data-act="zipall">⬇ Download all files (ZIP)</button>
   <button class="btn sm" data-act="json">Export JSON</button><button class="btn sm danger" data-act="reset">Reset to sample data</button></div>
   <div id="report"></div>`;
  $('#report').innerHTML=await reportMarkup('app');hydrate($('#report'))}
function route(){if(!S)return;const h=location.hash.replace(/^#\/?/,'').split('/');
  if(h[0]==='door'&&doorById(h[1]))renderDoor(h[1]);else if(h[0]==='summary')renderSummary();else renderList();window.scrollTo(0,0)}

/* ---------- actions ---------- */
async function addFiles(d,files){busy(true,'Saving…');let n=0;
  try{for(const f of files){const kind=(f.type||'').startsWith('video')||/\.(mov|mp4|webm|3gp|m4v)$/i.test(f.name)?'video':'photo';const id=uid();
    await putMedia({id,type:f.type||'application/octet-stream',data:await f.arrayBuffer(),orig:f.name});d.media.push({id,kind,type:f.type,ext:extOf(f),orig:f.name});n++}
  }catch(e){toast('Could not store file: '+(e.message||e.name))}
  save();busy(false);renderMedia(d);if(n)toast(n+' file(s) added')}
async function doorFiles(d,prefix){const out=[];for(const m of d.media){const b=await mediaBlob(m.id);if(b)out.push({name:(prefix||'')+mediaName(d,m),data:new Uint8Array(await b.arrayBuffer())})}return out}
const u8=async b=>new Uint8Array(await b.arrayBuffer());
const ACT={
  async add(){const n=S.doors.length+1;const d={id:uid(),ref:'Door-'+pad(n),location:'',type:'',rating:'',leaf:'Single',checks:{},overall:'',manual:false,issues:'',action:'',priority:'',notes:'',media:[]};S.doors.push(d);save();location.hash='#/door/'+d.id},
  async blank(){if(!confirm('Start a new blank survey? This deletes the sample doors and photos on this device.'))return;await clearMedia();S={isSample:false,survey:{site:'',address:'',client:'',inspector:'Gedas – SafeBuilt Solutions Ltd',date:today(),ref:''},doors:[]};save();route();toast('Blank survey started')},
  async reset(){if(!confirm('Reset to sample data? All current doors, photos and videos on this device will be deleted.'))return;busy(true,'Loading sample…');await loadSample();busy(false);location.hash='#/list';route();toast('Sample data restored')},
  allpass(b,d){CHECKS.forEach(c=>{const o=ck(d,c[0]);if(!o.r)o.r='pass'});save();renderDoor(d.id)},
  fillissues(b,d){const t=failed(d).map(c=>{const o=d.checks[c[0]];return c[1]+(o.c?': '+o.c:'')}).join('\n');d.issues=t;$('#issues').value=t;save();if(!t)toast('No failed items')},
  unoverride(b,d){d.manual=false;d.overall='';save();refreshOverall(d)},
  async deldoor(b,d){if(!confirm('Delete '+(d.ref||'this door')+' and its media?'))return;for(const m of d.media)await delMedia(m.id);S.doors.splice(S.doors.indexOf(d),1);save();location.hash='#/list'},
  async dlmedia(b,d){const m=d.media.find(x=>x.id===b.dataset.id);const bl=await mediaBlob(m.id);if(!bl)return toast('File missing');await saveBlob(bl,mediaName(d,m))},
  async delmedia(b,d){const m=d.media.find(x=>x.id===b.dataset.id);if(!confirm('Delete '+mediaName(d,m)+'?'))return;await delMedia(m.id);d.media.splice(d.media.indexOf(m),1);save();renderMedia(d)},
  async zipdoor(b,d){if(!d.media.length)return toast('No media for this door');busy(true);const z=makeZip(await doorFiles(d));busy(false);await saveBlob(z,safe(d.ref)+'_media.zip')},
  async pdf(){busy(true,'Building PDF…');try{const p=await buildPDF();busy(false);await saveBlob(p,baseName()+'_report.pdf')}catch(e){busy(false);toast('PDF failed: '+e.message+' – use Print / Save as PDF')}},
  print(){window.print()},
  async html(){busy(true);const h=await reportHTMLFile('html');busy(false);await saveBlob(new Blob([h],{type:'text/html'}),baseName()+'_report.html')},
  async zipall(){busy(true,'Building ZIP…');try{const te=new TextEncoder();const files=[{name:'report.pdf',data:await u8(await buildPDF())},{name:'report.html',data:te.encode(await reportHTMLFile('zip'))},{name:'survey-data.json',data:te.encode(exportJSON())}];
    for(const d of S.doors)files.push(...await doorFiles(d,'media/'));const z=makeZip(files);busy(false);await saveBlob(z,baseName()+'_all-files.zip')}catch(e){busy(false);toast('ZIP failed: '+e.message)}},
  qrpanel(){const el=$('#qrpanel');if(el){el.hidden=!el.hidden;if(!el.hidden)el.scrollIntoView({behavior:'smooth',block:'start'})}},
  async labels(){if(!S.doors.length)return toast('Add a door first');busy(true,'Building labels…');try{const st=+($('#qrstart')||{}).value||1;const p=buildLabels(S.doors,st);busy(false);await saveBlob(p,baseName()+'_QR-labels_L7163.pdf')}catch(e){busy(false);toast('Labels failed: '+e.message)}},
  async labeldoor(b,d){busy(true,'Building label…');try{const st=+($('#qrstart1')||{}).value||1;const p=buildLabels([d],st);busy(false);await saveBlob(p,safe(d.ref||'Door')+'_QR-label_L7163.pdf')}catch(e){busy(false);toast('Label failed: '+e.message)}},
  previewrec(b,d){const u=doorQR(d).url.replace(PUBLIC_URL,'door.html');window.open(u,'_blank')||(location.href=u)},
  async json(){await saveBlob(new Blob([exportJSON()],{type:'application/json'}),baseName()+'_data.json')}
};
function exportJSON(){ensureIds();return JSON.stringify({app:'SafeBuilt Solutions fire door inspection',exported:new Date().toISOString(),sample:!!S.isSample,survey:S.survey,
  doors:S.doors.map(d=>({...d,doorId:d.pid,recordUrl:recordURL(d),typeLabel:typeLabel(d.type),inspected:inspDate(),nextDue:nextDue(d),keyIssues:keyIssues(d),status:status(d),suggested:suggest(d),checks:CHECKS.map(c=>({key:c[0],item:c[1],result:(d.checks[c[0]]||{}).r||'',comment:(d.checks[c[0]]||{}).c||''})),media:d.media.map(m=>({file:mediaName(d,m),kind:m.kind,type:m.type,original:m.orig||m.caption||'',caption:m.caption||''}))}))},null,2)}
function refreshOverall(d){const o=$('#overall');if(o)o.innerHTML=overallHTML(d);const b=$('#dbadge');if(b){const s=status(d);b.className='badge '+s;b.textContent=stLabel(s)}}

app.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.s!==undefined){S.survey[t.dataset.s]=t.value;save();return}
  const d=cur();if(!d)return;
  if(t.dataset.d){d[t.dataset.d]=t.value;save();if(t.dataset.d==='ref')renderMedia(d)}
  else if(t.dataset.cc){ck(d,t.dataset.cc).c=t.value;save()}});
app.addEventListener('change',e=>{const t=e.target;if(t.type==='file'&&t.files&&t.files.length){const d=cur();addFiles(d,[...t.files]).then(()=>{t.value=''})}});
app.addEventListener('click',async e=>{
  const sb=e.target.closest('.seg button');
  if(sb){e.preventDefault();const g=sb.parentElement,d=cur(),v=sb.dataset.v;if(!d)return;
    if(g.dataset.ck){const o=ck(d,g.dataset.ck);o.r=o.r===v?'':v;paintSeg(g,o.r);save();refreshOverall(d)}
    else if(g.dataset.ov!==undefined){d.manual=true;d.overall=v;save();refreshOverall(d)}
    else if(g.dataset.da){d[g.dataset.da]=d[g.dataset.da]===v?'':v;paintSeg(g,d[g.dataset.da],'sel');save()}
    return}
  const b=e.target.closest('[data-act]');if(!b||!ACT[b.dataset.act])return;e.preventDefault();
  try{await ACT[b.dataset.act](b,cur())}catch(err){busy(false);toast('Error: '+(err.message||err))}});
window.addEventListener('hashchange',route);

(async function init(){
  const st=document.createElement('style');st.textContent=REPORT_CSS;document.head.appendChild(st);
  try{const raw=localStorage.getItem(LS);if(raw)S=JSON.parse(raw)}catch(e){}
  if(!S||!S.survey){try{await loadSample()}catch(e){S={isSample:false,survey:{date:today()},doors:[]};toast('Storage unavailable: '+e.message)}}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  route();
})();
</script>
</body>
</html>
