<script>
"use strict";
/* ---------- constants ---------- */
const LS='sbs_firedoor_v1';
const CHECKS=[
 ['leaf','Door leaf condition','No significant damage, holes, splits, delamination or warping; no unauthorised alterations.'],
 ['frame','Frame condition & fixing','Frame secure to structure and undamaged; gap between frame and wall properly fire-stopped/sealed.'],
 ['gaps','Leaf-to-frame gaps','Guidance: typically 2–4 mm (commonly 3 mm ±1) at head, hinge and lock sides and between leaves of double doors. Manufacturer data / BS 8214 take precedence.'],
 ['threshold','Threshold (bottom) gap','Guidance: up to ~10 mm for FD30 doors without smoke control (check certification); ~3 mm where smoke seals are required (FD30S/FD60S) unless a drop seal is fitted.'],
 ['intumescent','Intumescent strips','Present, continuous, correct size, intact – not painted over, damaged or missing sections.'],
 ['smoke','Smoke seals','Present and intact where required (S-rated doors); brush/fin not damaged, missing or painted over.'],
 ['hinges','Hinges','Minimum 3 hinges, secure, no missing, incorrect or damaged screws, CE/UKCA marked, no excessive wear.'],
 ['selfclose','Self-closing device','Fitted and closes the door fully from any angle of opening into the latch (required on flat entrance and communal fire doors).'],
 ['latch','Latching','Door latches positively when closed by the closer; no binding on frame or floor.'],
 ['closer','Door closer condition & adjustment','No oil leaks or damage; closing/latch speed correctly adjusted; arm and fixings secure.'],
 ['signage','Fire safety signage','“Fire door keep shut” (communal doors) or “Fire door keep locked” (risers/cupboards) present and legible.'],
 ['glazing','Glazing & beads (if present)','Fire-rated glass (marked), intact, beads secure, correct intumescent glazing system.'],
 ['ironmongery','Ironmongery','Handles, locks, letter plates, spy holes etc. fire-rated, secure and not compromising the door.'],
 ['holdopen','Hold-open devices (if fitted)','Hold-open/free-swing devices linked to the fire alarm and release on activation; door then closes and latches.'],
 ['cert','Certification label / plug','Third-party certification label or plug present (usually top or hinge edge); note scheme/number if visible.']
];
const TYPES=[['communal','Communal'],['flat','Flat entrance'],['riser','Riser'],['plant','Plant room'],['stair','Stair core']];
const RATINGS=['FD30','FD30S','FD60','FD60S','Unknown'];
const LEAFS=['Single','Double','Leaf and a half'];
const ACTIONS=['Repair','Adjust','Replace'];
const PRIS=['Urgent','Within 3 months','Advisory'];
const GUIDANCE='Gap and seal figures are typical guidance only – BS 8214:2016 and the door manufacturer’s certification data take precedence. Under the Fire Safety (England) Regulations 2022, responsible persons in multi-occupied residential buildings over 11 m must undertake quarterly checks of communal fire doors and use best endeavours to check flat entrance doors annually. This is a visual, non-destructive inspection and does not certify fire performance.';
const REPORT_CSS=`.report{font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#1d2330;background:#fff;padding:16px;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.report .rh{background:#b71c1c;color:#fff;padding:14px 16px;border-radius:8px;margin-bottom:12px}.report .rh h1{margin:0;font-size:20px}.report .rh p{margin:2px 0 0;opacity:.95}
.report h2{font-size:16px;margin:18px 0 6px;border-bottom:2px solid #b71c1c;padding-bottom:3px}
.report .samp{background:#fff8e1;border:1px solid #ffe082;padding:8px 10px;border-radius:6px;margin:8px 0;font-weight:600}
.report table{width:100%;border-collapse:collapse;margin:6px 0}.report th,.report td{border:1px solid #ddd;padding:6px;text-align:left;vertical-align:top}.report th{background:#f3f3f3}
.report .kv th{width:34%}
.report .rc{display:flex;gap:8px;margin:10px 0}.report .rc div{flex:1;border:1px solid #ddd;border-radius:8px;text-align:center;padding:8px;font-size:12px}.report .rc b{display:block;font-size:22px}
.report .rc .p b{color:#2e7d32}.report .rc .x b{color:#c62828}
.report .st{display:inline-block;font-weight:800;color:#fff;padding:2px 8px;border-radius:999px;background:#8a8f98;font-size:11px;white-space:nowrap}.report .st.pass{background:#2e7d32}.report .st.fail{background:#c62828}
.report .schedwrap{overflow-x:auto}.report .sched{font-size:12px;min-width:520px}
.report .dd{border:1px solid #ddd;border-radius:8px;padding:10px;margin:12px 0;page-break-inside:avoid;break-inside:avoid}
.report .dd h3{margin:0 0 4px;font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.report .meta{color:#555;margin:0 0 6px}

.report .r-pass{color:#2e7d32;font-weight:700}.report .r-fail{color:#c62828;font-weight:700}.report .r-na{color:#607d8b}.report .r-{color:#999}
.report .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.report .thumbs figure{margin:0}.report .thumbs img,.report .thumbs video{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:1px solid #ddd;display:block;background:#222}
.report .thumbs .vid{aspect-ratio:4/3;border-radius:6px;background:#263238;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;padding:6px}
.report .thumbs figcaption{font-size:11px;color:#555;word-break:break-all}
.report .gn{font-size:11px;color:#555;margin-top:16px;border-top:1px solid #ddd;padding-top:8px}
.report a{color:inherit}`;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const safe=s=>String(s||'').trim().replace(/[^A-Za-z0-9._-]+/g,'-').replace(/^-+|-+$/g,'')||'file';
const typeLabel=t=>(TYPES.find(x=>x[0]===t)||['',t||'—'])[1];
const stLabel=s=>s==='pass'?'PASS':s==='fail'?'FAIL':'NOT INSPECTED';
const rLabel=r=>r==='pass'?'Pass':r==='fail'?'Fail':r==='na'?'N/A':'–';
let S=null;
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('Could not save: '+e.message)}}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}
function busy(on,msg){const b=$('#busy');b.textContent=msg||'Preparing file…';b.classList.toggle('show',!!on)}
const doorById=id=>S.doors.find(d=>d.id===id);
function cur(){const h=location.hash.split('/');return h[1]==='door'?doorById(h[2]):null}
const ck=(d,k)=>d.checks[k]||(d.checks[k]={r:'',c:''});
function suggest(d){const v=CHECKS.map(c=>(d.checks[c[0]]||{}).r||'');if(v.includes('fail'))return 'fail';if(v.every(x=>x==='pass'||x==='na'))return 'pass';return ''}
function status(d){return d.manual&&d.overall?d.overall:suggest(d)}
function failed(d){return CHECKS.filter(c=>(d.checks[c[0]]||{}).r==='fail')}
function keyIssues(d){const t=(d.issues||'').trim();if(t)return t;const f=failed(d);if(f.length)return f.map(c=>c[1]).join('; ');return status(d)==='pass'?'None':'—'}
const EXT={'image/jpeg':'jpg','image/jpg':'jpg','image/png':'png','image/heic':'heic','image/heif':'heif','image/webp':'webp','image/gif':'gif','video/mp4':'mp4','video/quicktime':'mov','video/webm':'webm','video/3gpp':'3gp','video/x-m4v':'m4v'};
function extOf(f){if(EXT[f.type])return EXT[f.type];const m=/\.([A-Za-z0-9]{1,5})$/.exec(f.name||'');return m?m[1].toLowerCase():'bin'}
function mediaName(d,m){const list=d.media.filter(x=>x.kind===m.kind);return safe(d.ref||'Door')+'_'+m.kind+'-'+(list.indexOf(m)+1)+'.'+m.ext}
function baseName(){return safe(S.survey.ref||'fire-door-survey')}

/* ---------- IndexedDB media store ---------- */
let dbp;
function db(){return dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('sbs_firedoor_media',1);r.onupgradeneeded=()=>r.result.createObjectStore('media',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function idb(mode,fn){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction('media',mode);const r=fn(tx.objectStore('media'));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
const putMedia=rec=>idb('readwrite',s=>s.put(rec));
const getMedia=id=>idb('readonly',s=>s.get(id));
const delMedia=id=>idb('readwrite',s=>s.delete(id));
const clearMedia=()=>idb('readwrite',s=>s.clear());
const URLS={};
async function mediaBlob(id){const r=await getMedia(id);return r?new Blob([r.data],{type:r.type}):null}
async function mediaURL(id){if(URLS[id])return URLS[id];const b=await mediaBlob(id);if(!b)return '';return URLS[id]=URL.createObjectURL(b)}
async function hydrate(root){for(const el of root.querySelectorAll('[data-mid]')){const u=await mediaURL(el.dataset.mid);if(!u){el.replaceWith(Object.assign(document.createElement('div'),{className:'vid',textContent:'File missing on this device'}));continue}el.src=el.tagName==='VIDEO'?u+'#t=0.1':u}}

/* ---------- save / share a file (works on iOS Safari) ---------- */
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
async function saveBlob(blob,name){
  if(isIOS&&navigator.canShare&&window.File){
    try{const f=new File([blob],name,{type:blob.type||'application/octet-stream'});
      if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}
    }catch(e){if(e&&e.name==='AbortError')return;/* fall through to anchor download */}
  }
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=name;a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);toast('Downloading '+name);
}

/* ---------- image thumbnails (JPEG) for PDF / HTML export ---------- */
const TH={};
async function thumbFor(id,max){max=max||900;const key=id+':'+max;if(TH[key]!==undefined)return TH[key];
  try{const b=await mediaBlob(id);if(!b)return TH[key]=null;const u=URL.createObjectURL(b);
    const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=u});
    const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.max(1,Math.round(img.naturalWidth*k)),h=Math.max(1,Math.round(img.naturalHeight*k));
    const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);URL.revokeObjectURL(u);
    const dataURL=c.toDataURL('image/jpeg',.82);const bin=atob(dataURL.split(',')[1]);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    return TH[key]={url:dataURL,bytes,w,h};
  }catch(e){return TH[key]=null}
}

/* ---------- minimal ZIP writer (store, no compression) ---------- */
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRCT[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function makeZip(files){
  const te=new TextEncoder(),parts=[],central=[];let off=0;const d=new Date();
  const time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const f of files){const nm=te.encode(f.name),data=f.data,crc=crc32(data),sz=data.length;
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,time,true);h.setUint16(12,date,true);h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(h.buffer,nm,data);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,time,true);c.setUint16(14,date,true);c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    central.push(c.buffer,nm);off+=30+nm.length+sz;}
  const cd=central.reduce((a,b)=>a+b.byteLength,0);const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cd,true);e.setUint32(16,off,true);
  return new Blob([...parts,...central,e.buffer],{type:'application/zip'});
}

/* ---------- minimal PDF writer (Helvetica + embedded JPEGs) ---------- */
const HW=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const WIN={'–':'\x96','—':'\x97','‘':'\x91','’':'\x92','“':'\x93','”':'\x94','•':'\x95','…':'\x85','€':'\x80','✔':'v','✖':'x','≤':'<=','≥':'>=','±':'\xb1'};

function field(lbl,k,v,ph,src,type){return `<label class="f">${lbl}<input type="${type||'text'}" data-${src||'d'}="${k}" value="${esc(v)}" placeholder="${esc(ph||'')}" autocomplete="off"></label>`}
function sel(lbl,k,opts,v){return `<label class="f">${lbl}<select data-d="${k}"><option value="">Select…</option>${opts.map(o=>{const [val,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}"${val===v?' selected':''}>${esc(t)}</option>`}).join('')}</select></label>`}
function seg(attr,opts,val,cls){return `<div class="seg" ${attr}>${opts.map(([v,t])=>`<button type="button" data-v="${esc(v)}" class="${val===v?'on '+(cls||v):''}">${t}</button>`).join('')}</div>`}
function paintSeg(el,val,cls){el.querySelectorAll('button').forEach(b=>b.className=b.dataset.v===val?'on '+(cls||b.dataset.v):'')}

function renderList(){setNav('list');const s=S.survey,c=counts();
  app.innerHTML=`${S.isSample?`<section class="card banner"><b>Sample data loaded.</b> <span class="muted">This is an example 5-door survey to show how the app works. Edit it, or start a blank survey.</span><div class="row" style="margin-top:10px"><button class="btn sm" data-act="blank">Start blank survey</button></div></section>`:''}
  <details class="card" id="survey" ${S.doors.length?'':'open'}><summary>Survey details <span class="muted">${esc(s.ref||'')}</span></summary>
   ${field('Site / building name','site',s.site,'e.g. Marlowe Court','s')}${field('Address','address',s.address,'Street, town, postcode','s')}${field('Client','client',s.client,'','s')}
   ${field('Inspector','inspector',s.inspector,'','s')}${field('Survey date','date',s.date,'','s','date')}${field('Survey reference','ref',s.ref,'e.g. SBS-FD-2026-0001','s')}
  </details>
  <div class="counts"><div><b>${c.total}</b>Doors</div><div class="p"><b>${c.pass}</b>Pass</div><div class="x"><b>${c.fail}</b>Fail</div><div><b>${c.none}</b>Not insp.</div></div>
  <ul class="doors">${S.doors.map(d=>{const st=status(d);return `<li><a class="door-row ${st}" href="#/door/${d.id}"><div><b>${esc(d.ref||'(no ref)')}</b><small>${esc(d.location||'No location')}</small><small>${esc(typeLabel(d.type))} · ${esc(d.rating||'—')}${d.media.length?' · 📷 '+d.media.length:''}</small></div><span class="badge ${st}">${stLabel(st)}</span></a></li>`}).join('')||'<li class="empty">No doors yet – tap “Add door”.</li>'}</ul>
  <button class="btn primary block" data-act="add">＋ Add door</button>`;
}
function checkItem(d,c){const o=d.checks[c[0]]||{};return `<div class="ck"><b>${esc(c[1])}</b><p class="hint">${esc(c[2])}</p>${seg(`data-ck="${c[0]}"`,[['pass','✔ Pass'],['fail','✖ Fail'],['na','N/A']],o.r||'')}<input type="text" data-cc="${c[0]}" value="${esc(o.c||'')}" placeholder="Comment (optional)"></div>`}
function overallHTML(d){const sg=suggest(d),st=status(d),nf=failed(d).length,nu=CHECKS.filter(c=>!(d.checks[c[0]]||{}).r).length;
  return `<h2>Overall result</h2><p class="hint">Suggested: <span class="badge ${sg}">${stLabel(sg)}</span> ${nf?nf+' item(s) failed':nu?nu+' item(s) not yet checked':'all items Pass / N/A'}</p>
  ${seg('data-ov=""',[['pass','✔ PASS'],['fail','✖ FAIL']],st)}
  ${d.manual?`<p class="hint">${d.overall!==sg?'<b>Manual override</b> – differs from suggestion. ':'Set manually. '}<button type="button" class="btn sm" data-act="unoverride">Use suggestion</button></p>`:'<p class="hint">Follows checklist automatically – tap to override.</p>'}`}
function renderDoor(id){setNav('list');const d=doorById(id),i=S.doors.indexOf(d),n=S.doors.length,prev=S.doors[i-1],next=S.doors[i+1];
  app.innerHTML=`<div class="bar"><a class="btn" href="#/list">‹ Doors</a><span class="muted">Door ${i+1} of ${n}</span><span id="dbadge" class="badge ${status(d)}">${stLabel(status(d))}</span></div>
  <section class="card"><h2>Door details</h2>${field('Door reference','ref',d.ref,'e.g. Door-06')}${field('Location','location',d.location,'e.g. Ground floor communal lobby')}
   ${sel('Door type','type',TYPES,d.type)}${sel('Fire rating','rating',RATINGS,d.rating)}${sel('Door leaf type','leaf',LEAFS,d.leaf)}</section>
  <section class="card"><h2>Checklist</h2><p class="hint">Based on Fire Safety (England) Regulations 2022 guidance, BS 8214 and FDIS-style checks. Tap again to clear.</p>
   <div class="row" style="margin:10px 0 0"><button type="button" class="btn sm" data-act="allpass">Set unanswered to Pass</button></div>
   ${CHECKS.map(c=>checkItem(d,c)).join('')}</section>
  <section class="card" id="overall">${overallHTML(d)}</section>
  <section class="card"><h2>Issues & action</h2>
   <label class="f">Issues found<textarea id="issues" data-d="issues" placeholder="Summary of defects">${esc(d.issues)}</textarea></label>
   <button type="button" class="btn sm" data-act="fillissues" style="margin:-4px 0 12px">Fill from failed items</button>
   <label class="f">Recommended action${seg('data-da="action"',ACTIONS.map(a=>[a,a]),d.action,'sel')}</label>
   <label class="f">Priority${seg('data-da="priority"',PRIS.map(a=>[a,a]),d.priority,'sel')}</label>
   <label class="f">Notes<textarea data-d="notes" placeholder="Any other notes">${esc(d.notes)}</textarea></label></section>
  <section class="card"><h2>Photos & video</h2>
   <div class="uploads"><label class="btn"><span class="i">📷</span>Take photo<input type="file" accept="image/*" capture="environment"></label><label class="btn"><span class="i">🎥</span>Record video<input type="file" accept="video/*" capture="environment"></label><label class="btn"><span class="i">🖼️</span>From library<input type="file" accept="image/*,video/*" multiple></label></div>
   <div id="media" class="grid"></div>
   <button type="button" class="btn block" data-act="zipdoor">⬇ Download all media (ZIP)</button></section>
  <div class="bar">${prev?`<a class="btn" href="#/door/${prev.id}">‹ ${esc(prev.ref)}</a>`:'<span></span>'}${next?`<a class="btn" href="#/door/${next.id}">${esc(next.ref)} ›</a>`:`<a class="btn primary" href="#/summary">Report ›</a>`}</div>
  <button type="button" class="btn danger block" data-act="deldoor">Delete this door</button>`;
  renderMedia(d);
}
function renderMedia(d){const el=$('#media');if(!el)return;
  el.innerHTML=d.media.length?d.media.map(m=>`<div class="mi">${m.kind==='video'?`<video data-mid="${m.id}" controls playsinline muted preload="metadata"></video>`:`<img data-mid="${m.id}" alt="">`}<div class="mname">${esc(mediaName(d,m))}</div><div class="mbtns"><button type="button" class="btn sm" data-act="dlmedia" data-id="${m.id}">⬇ Download</button><button type="button" class="btn sm danger" data-act="delmedia" data-id="${m.id}" aria-label="Delete">🗑</button></div></div>`).join(''):'<p class="muted" style="grid-column:1/-1">No photos or videos yet.</p>';
  hydrate(el)}
async function renderSummary(){setNav('summary');
  app.innerHTML=`<div class="actions noprint">
   <button class="btn primary wide" data-act="pdf">⬇ Download report (PDF)</button>
   <button class="btn" data-act="print">🖨 Print / Save as PDF</button><button class="btn" data-act="html">⬇ Report (HTML)</button>
   <button class="btn dark wide" data-act="zipall">⬇ Download all files (ZIP)</button>
   <button class="btn sm" data-act="json">Export JSON</button><button class="btn sm danger" data-act="reset">Reset to sample data</button></div>
   <div id="report"></div>`;
  $('#report').innerHTML=await reportMarkup('app');hydrate($('#report'))}
function route(){if(!S)return;const h=location.hash.replace(/^#\/?/,'').split('/');
  if(h[0]==='door'&&doorById(h[1]))renderDoor(h[1]);else if(h[0]==='summary')renderSummary();else renderList();window.scrollTo(0,0)}

/* ---------- actions ---------- */
async function addFiles(d,files){busy(true,'Saving…');let n=0;
  try{for(const f of files){const kind=(f.type||'').startsWith('video')||/\.(mov|mp4|webm|3gp|m4v)$/i.test(f.name)?'video':'photo';const id=uid();
    await putMedia({id,type:f.type||'application/octet-stream',data:await f.arrayBuffer(),orig:f.name});d.media.push({id,kind,type:f.type,ext:extOf(f),orig:f.name});n++}
  }catch(e){toast('Could not store file: '+(e.message||e.name))}
  save();busy(false);renderMedia(d);if(n)toast(n+' file(s) added')}
async function doorFiles(d,prefix){const out=[];for(const m of d.media){const b=await mediaBlob(m.id);if(b)out.push({name:(prefix||'')+mediaName(d,m),data:new Uint8Array(await b.arrayBuffer())})}return out}
const u8=async b=>new Uint8Array(await b.arrayBuffer());
const ACT={
  async add(){const n=S.doors.length+1;const d={id:uid(),ref:'Door-'+pad(n),location:'',type:'',rating:'',leaf:'Single',checks:{},overall:'',manual:false,issues:'',action:'',priority:'',notes:'',media:[]};S.doors.push(d);save();location.hash='#/door/'+d.id},
  async blank(){if(!confirm('Start a new blank survey? This deletes the sample doors and photos on this device.'))return;await clearMedia();S={isSample:false,survey:{site:'',address:'',client:'',inspector:'Gedas – SafeBuilt Solutions Ltd',date:today(),ref:''},doors:[]};save();route();toast('Blank survey started')},
  async reset(){if(!confirm('Reset to sample data? All current doors, photos and videos on this device will be deleted.'))return;busy(true,'Loading sample…');await loadSample();busy(false);location.hash='#/list';route();toast('Sample data restored')},
  allpass(b,d){CHECKS.forEach(c=>{const o=ck(d,c[0]);if(!o.r)o.r='pass'});save();renderDoor(d.id)},
  fillissues(b,d){const t=failed(d).map(c=>{const o=d.checks[c[0]];return c[1]+(o.c?': '+o.c:'')}).join('\n');d.issues=t;$('#issues').value=t;save();if(!t)toast('No failed items')},
  unoverride(b,d){d.manual=false;d.overall='';save();refreshOverall(d)},
  async deldoor(b,d){if(!confirm('Delete '+(d.ref||'this door')+' and its media?'))return;for(const m of d.media)await delMedia(m.id);S.doors.splice(S.doors.indexOf(d),1);save();location.hash='#/list'},
  async dlmedia(b,d){const m=d.media.find(x=>x.id===b.dataset.id);const bl=await mediaBlob(m.id);if(!bl)return toast('File missing');await saveBlob(bl,mediaName(d,m))},
  async delmedia(b,d){const m=d.media.find(x=>x.id===b.dataset.id);if(!confirm('Delete '+mediaName(d,m)+'?'))return;await delMedia(m.id);d.media.splice(d.media.indexOf(m),1);save();renderMedia(d)},
  async zipdoor(b,d){if(!d.media.length)return toast('No media for this door');busy(true);const z=makeZip(await doorFiles(d));busy(false);await saveBlob(z,safe(d.ref)+'_media.zip')},
  async pdf(){busy(true,'Building PDF…');try{const p=await buildPDF();busy(false);await saveBlob(p,baseName()+'_report.pdf')}catch(e){busy(false);toast('PDF failed: '+e.message+' – use Print / Save as PDF')}},
  print(){window.print()},
  async html(){busy(true);const h=await reportHTMLFile('html');busy(false);await saveBlob(new Blob([h],{type:'text/html'}),baseName()+'_report.html')},
  async zipall(){busy(true,'Building ZIP…');try{const te=new TextEncoder();const files=[{name:'report.pdf',data:await u8(await buildPDF())},{name:'report.html',data:te.encode(await reportHTMLFile('zip'))},{name:'survey-data.json',data:te.encode(exportJSON())}];
    for(const d of S.doors)files.push(...await doorFiles(d,'media/'));const z=makeZip(files);busy(false);await saveBlob(z,baseName()+'_all-files.zip')}catch(e){busy(false);toast('ZIP failed: '+e.message)}},
  async json(){await saveBlob(new Blob([exportJSON()],{type:'application/json'}),baseName()+'_data.json')}
};
function exportJSON(){return JSON.stringify({app:'SafeBuilt Solutions fire door inspection',exported:new Date().toISOString(),sample:!!S.isSample,survey:S.survey,
  doors:S.doors.map(d=>({...d,status:status(d),suggested:suggest(d),checks:CHECKS.map(c=>({key:c[0],item:c[1],result:(d.checks[c[0]]||{}).r||'',comment:(d.checks[c[0]]||{}).c||''})),media:d.media.map(m=>({file:mediaName(d,m),kind:m.kind,type:m.type,original:m.orig||m.caption||''}))}))},null,2)}
function refreshOverall(d){const o=$('#overall');if(o)o.innerHTML=overallHTML(d);const b=$('#dbadge');if(b){const s=status(d);b.className='badge '+s;b.textContent=stLabel(s)}}

app.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.s!==undefined){S.survey[t.dataset.s]=t.value;save();return}
  const d=cur();if(!d)return;
  if(t.dataset.d){d[t.dataset.d]=t.value;save();if(t.dataset.d==='ref')renderMedia(d)}
  else if(t.dataset.cc){ck(d,t.dataset.cc).c=t.value;save()}});
app.addEventListener('change',e=>{const t=e.target;if(t.type==='file'&&t.files&&t.files.length){const d=cur();addFiles(d,[...t.files]).then(()=>{t.value=''})}});
app.addEventListener('click',async e=>{
  const sb=e.target.closest('.seg button');
  if(sb){e.preventDefault();const g=sb.parentElement,d=cur(),v=sb.dataset.v;if(!d)return;
    if(g.dataset.ck){const o=ck(d,g.dataset.ck);o.r=o.r===v?'':v;paintSeg(g,o.r);save();refreshOverall(d)}
    else if(g.dataset.ov!==undefined){d.manual=true;d.overall=v;save();refreshOverall(d)}
    else if(g.dataset.da){d[g.dataset.da]=d[g.dataset.da]===v?'':v;paintSeg(g,d[g.dataset.da],'sel');save()}
    return}
  const b=e.target.closest('[data-act]');if(!b||!ACT[b.dataset.act])return;e.preventDefault();
  try{await ACT[b.dataset.act](b,cur())}catch(err){busy(false);toast('Error: '+(err.message||err))}});
window.addEventListener('hashchange',route);

(async function init(){
  const st=document.createElement('style');st.textContent=REPORT_CSS;document.head.appendChild(st);
  try{const raw=localStorage.getItem(LS);if(raw)S=JSON.parse(raw)}catch(e){}
  if(!S||!S.survey){try{await loadSample()}catch(e){S={isSample:false,survey:{date:today()},doors:[]};toast('Storage unavailable: '+e.message)}}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  route();
})();
</script>
</body>
</html>
