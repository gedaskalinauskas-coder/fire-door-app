<script>
/* catch Android's install prompt as early as possible (it can fire before the page finishes loading) */
window.__bip=null;addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__bip=e;if(window.__onbip)window.__onbip(e)});

<style>
:root{--black:#141414;--yellow:#dcca1c;--pink:#e53376;--ink:#1d2330}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--black);color:#fff;
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{flex:1;width:100%;max-width:460px;margin:0 auto;padding:28px 20px 12px;text-align:center}
.logo{display:block;width:210px;max-width:70%;height:auto;margin:4px auto 22px}
.app{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 6px}
.app img{width:56px;height:56px;border-radius:13px;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
h1{font-size:26px;line-height:1.15;margin:0}
.desc{margin:6px 0 24px;color:#c9ccd3;font-size:16px}
.bar{width:64px;height:5px;background:var(--pink);border-radius:3px;margin:0 auto 24px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:62px;padding:14px 18px;border:0;border-radius:14px;
  background:var(--yellow);color:#000;font-family:inherit;font-weight:800;font-size:20px;line-height:1.2;text-decoration:none;cursor:pointer;-webkit-appearance:none;appearance:none;
  box-shadow:0 4px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.sec{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.35);box-shadow:none;font-size:17px;min-height:52px;margin-top:12px}
.btn svg{flex:none}
.msg{color:#e6e7ea;margin:0 0 18px}
.card{background:#fff;color:var(--ink);border-radius:14px;padding:16px;margin:16px 0 0;text-align:left;border-top:4px solid var(--yellow)}
.card h2{font-size:17px;margin:0 0 10px}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #eceef1;font-size:16px}
ol.steps li:first-child{border-top:0}
ol.steps li::before{counter-increment:s;content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--black);color:var(--yellow);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.ico{flex:none;width:40px;height:40px;border-radius:10px;background:#f2f3f6;display:flex;align-items:center;justify-content:center;color:#0a7aff}
.ico.txt{width:auto;padding:0 10px;font-weight:700;font-size:15px}
.hint{font-size:13px;color:#5b6170;margin:10px 0 0}
.warn{background:#fff4f8;border-top-color:var(--pink)}
.url{display:block;word-break:break-all;font:13px/1.3 ui-monospace,Menlo,Consolas,monospace;background:#f2f3f6;border-radius:8px;padding:10px;margin:10px 0}
.copy{min-height:48px;font-size:17px}
.qr{background:#fff;border-radius:14px;padding:14px;display:inline-block;margin:18px auto 6px}
.qr svg{display:block;width:180px;height:180px}
.small{font-size:13px;color:#a8adb7}
.alt{display:inline-block;margin:22px 0 6px;color:#c9ccd3;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:8px}
footer{text-align:center;font-size:11px;color:#8a8f98;padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
</style>
</head>

  r.setProperty('--black',c.black);r.setProperty('--yellow',c.yellow);r.setProperty('--pink',c.pink);r.setProperty('--ink',c.ink);
  document.title='Install '+BRAND.appName;$('#appname').textContent=BRAND.appName;$('#desc').textContent=BRAND.inviteLine;
  $('#logo').src=BRAND.headerLogo;$('#logo').alt=BRAND.name;$('#foot').textContent=copyrightLine();
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=c.black})();

/* ---- device detection ---- */
const ua=navigator.userAgent||'';
const isIPad=/iPad/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1); /* iPadOS 13+ reports itself as a Mac */
const isIOS=/iPhone|iPod/.test(ua)||isIPad;
const isAndroid=/Android/i.test(ua);
const standalone=navigator.standalone===true||['standalone','fullscreen','minimal-ui','window-controls-overlay'].some(m=>matchMedia('(display-mode: '+m+')').matches);
/* iOS: only Safari offers the full "Add to Home Screen" web-app install. Other browsers / in-app viewers: */
const iosOther=isIOS&&(/CriOS|FxiOS|EdgiOS|OPiOS|OPT\/|YaBrowser|DuckDuckGo|GSA\//.test(ua)?'browser':
  (/FBAN|FBAV|FB_IAB|Instagram|WhatsApp|Line\/|Snapchat|Twitter|LinkedInApp|GmailApp|Gmail|MicroMessenger|Outlook|Teams/i.test(ua)||!/Safari\//.test(ua))?'inapp':'');
const iosBrowserName=/CriOS/.test(ua)?'Chrome':/FxiOS/.test(ua)?'Firefox':/EdgiOS/.test(ua)?'Edge':/GSA\//.test(ua)?'the Google app':'this browser';
const androidWebView=isAndroid&&(/; wv\)/.test(ua)||/FBAN|FBAV|Instagram|Line\/|WhatsApp|Snapchat|GmailApp/i.test(ua));
const isSamsung=/SamsungBrowser/.test(ua);
const device=standalone?'installed':isIOS?'ios':isAndroid?'android':'desktop';
document.documentElement.dataset.device=device;
const inviteURL=new URL('invite.html',location.href).href;

/* ---- icons (inline SVG, no network) ---- */
const I={
 share:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>',
 add:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 8v8M8 12h8"/></svg>',
 dots:'<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>',
 dl:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>',
 open:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
 safari:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z" fill="currentColor"/></svg>',
 copy:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>'
};
const openBtn=(sec)=>`<a class="btn${sec?' sec':''}" id="openapp" href="${APP_URL}">${I.open}<span>Open the app</span></a>`;
const step=(ico,html,txt)=>`<li><span class="ico${txt?' txt':''}">${ico}</span><span>${html}</span></li>`;
const copyBlock=()=>`<span class="url" id="url">${esc(inviteURL)}</span><button class="btn copy" id="copybtn" type="button">${I.copy}<span>Copy link</span></button>`;

async function copyLink(btn){let ok=false;
  try{await navigator.clipboard.writeText(inviteURL);ok=true}catch(e){}
  if(!ok){try{const t=document.createElement('textarea');t.value=inviteURL;t.setAttribute('readonly','');t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);
    t.select();t.setSelectionRange(0,99999);ok=document.execCommand('copy');t.remove()}catch(e){}}
  const s=btn.querySelector('span');s.textContent=ok?'Link copied':'Press and hold the link above to copy';
  setTimeout(()=>{s.textContent='Copy link'},2500)}

/* ---- views ---- */
const V=$('#view');
function viewInstalled(){
  V.innerHTML=`<p class="msg">${esc(BRAND.appName)} is installed on this device.</p>${openBtn()}`;
  $('#altlink').hidden=true}

function viewIOS(){
  if(iosOther){
    V.innerHTML=`<div class="card warn"><h2>${I.safari.replace('currentColor','#e53376')} Open this link in Safari</h2>
      <p style="margin:0">${iosOther==='browser'?'You are in '+esc(iosBrowserName)+'.':'You are in an app’s built-in browser.'} iPhone installs apps from <b>Safari</b>. Copy the link, open Safari, paste it in the address bar, then tap Install.</p>
      ${copyBlock()}
      ${iosOther==='inapp'?'<p class="hint">Or look for <b>Open in Safari</b> (compass or ••• menu) in this screen.</p>':'<p class="hint">On iOS 16.4 or later '+esc(iosBrowserName)+' can also do it: tap its Share button, then <b>Add to Home Screen</b>.</p>'}
    </div>`;
    $('#copybtn').onclick=e=>copyLink(e.currentTarget);return}
  V.innerHTML=`<button class="btn" id="installbtn" type="button" aria-expanded="false" aria-controls="steps">${I.dl}<span>Install</span></button>
    <div class="card" id="steps" hidden><h2>Add ${esc(BRAND.appName)} to your Home Screen</h2>
      <ol class="steps">
        ${step(I.share,`Tap the <b>Share</b> button ${isIPad?'at the top of Safari':'at the bottom of Safari'}`)}
        ${step(I.add,'Scroll down and tap <b>Add to Home Screen</b>')}
        ${step('Add','Tap <b>Add</b> in the top corner',1)}
      </ol>
      <p class="hint">Can’t see Share? Tap <b>•••</b> next to the address bar first (newer iOS). Keep <b>Open as Web App</b> switched on.
      If “Add to Home Screen” is missing, make sure this page is open in Safari, not inside another app.</p>
      <p class="hint">Then open <b>${esc(BRAND.appName)}</b> from your Home Screen.</p>
    </div>`;
  $('#installbtn').onclick=()=>{const s=$('#steps'),open=s.hidden;s.hidden=!open;$('#installbtn').setAttribute('aria-expanded',String(open));
    if(open)s.scrollIntoView({behavior:'smooth',block:'nearest'})}}

function androidSteps(){
  return isSamsung?`<ol class="steps">${step(I.dots.replace('cx="12" cy="5"','cx="5" cy="12"').replace('cx="12" cy="19"','cx="19" cy="12"')+'','Tap the <b>menu</b> (☰) at the bottom')}${step(I.add,'Tap <b>Add page to</b> → <b>Home screen</b>')}${step('Add','Tap <b>Add</b>',1)}</ol>`
   :`<ol class="steps">${step(I.dots,'Tap the Chrome menu <b>⋮</b> (top right)')}${step(I.add,'Tap <b>Install app</b> or <b>Add to Home screen</b>')}${step('Install','Tap <b>Install</b> to confirm',1)}</ol>`}
function viewAndroid(){
  if(androidWebView){
    V.innerHTML=`<div class="card warn"><h2>Open this link in Chrome</h2><p style="margin:0">You are in an app’s built-in browser. Copy the link and open it in Chrome to install.</p>${copyBlock()}
      <p class="hint">Or tap <b>⋮</b> and choose <b>Open in Chrome</b> / <b>Open in browser</b>.</p></div>`;
    $('#copybtn').onclick=e=>copyLink(e.currentTarget);return}
  V.innerHTML=`<button class="btn" id="installbtn" type="button">${I.dl}<span>Install</span></button>
    <div class="card" id="steps" hidden><h2>Install ${esc(BRAND.appName)}</h2>${androidSteps()}
      <p class="hint">Then open <b>${esc(BRAND.appName)}</b> from your home screen.</p></div>`;
  $('#installbtn').onclick=async()=>{const e=window.__bip;
    if(e){window.__bip=null;try{e.prompt();const r=await e.userChoice;if(r&&r.outcome==='accepted'){viewDone();return}}catch(err){}}
    const s=$('#steps');s.hidden=false;s.scrollIntoView({behavior:'smooth',block:'nearest'})}}
function viewDone(){V.innerHTML=`<p class="msg">Installed. Open <b>${esc(BRAND.appName)}</b> from your home screen, or:</p>${openBtn()}`}

function qrSVG(text){if(typeof qrcode!=='function')return '';const q=qrcode(0,'M');q.addData(text);q.make();
  const n=q.getModuleCount(),m=2,s=n+m*2;let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m} ${r+m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${s} ${s}" shape-rendering="crispEdges" role="img" aria-label="QR code for ${esc(text)}"><rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}
function viewDesktop(){
  V.innerHTML=`<p class="msg">${esc(BRAND.appName)} works in any modern browser – you can use it on this computer straight away.</p>
    ${openBtn()}
    <div class="qr" id="qr">${qrSVG(inviteURL)}</div>
    <p class="small">For site surveys, scan this with your phone to install it there.<br><span style="word-break:break-all">${esc(inviteURL)}</span></p>`;
  $('#altlink').hidden=true}

({installed:viewInstalled,ios:viewIOS,android:viewAndroid,desktop:viewDesktop})[device]();
addEventListener('appinstalled',()=>{if(device==='android')viewDone()});

/* ---- offline support: same service worker as the app ---- */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{})});
</script>
</body>
</html>
